version: "3.9"

services:
  securox:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securox-backend
    ports:
      - "8000:8000"
    volumes:
      - ./frontend:/app/../frontend:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/stats')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional: Nginx to serve frontend separately
  nginx:
    image: nginx:alpine
    container_name: securox-nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - securox
    restart: unless-stopped

networks:
  default:
    name: securox-network
